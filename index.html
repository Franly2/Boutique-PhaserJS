<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Glow Up Boutique</title>

    <!-- Optional Google Fonts (gracefully falls back to system rounded font when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- [LAYER 0] Core Engine & Offline Base64 Asset Bundle -->
    <script src="lib/phaser.min.js"></script>
    <script src="assets_data.js"></script>
</head>
<body>
    <div class="font-preload" style="font-weight: 700;">preload</div>
    <div class="font-preload" style="font-weight: 800;">preload</div>

    <div id="game-container"></div>

    <!--
      SCRIPT DEPENDENCY ORDER (Strict Load Sequence for file:// compatibility):
      1. Config     : constants.js & assetManifest.js (no dependencies)
      2. Systems    : ViewportManager & VFXManager (depends on Constants)
      3. Components : TopBar, Avatar, WardrobeCatalog, Decorations (depends on Config & Systems)
      4. Scenes     : BoutiqueScene (depends on Config, Systems, Components)
      5. Bootstrap  : main.js (depends on Constants & BoutiqueScene)
    -->

    <!-- [LAYER 1] Configuration & Data -->
    <script src="src/config/constants.js"></script>
    <script src="src/config/assetManifest.js"></script>

    <!-- [LAYER 2] Reusable Systems -->
    <script src="src/systems/ViewportManager.js"></script>
    <script src="src/systems/VFXManager.js"></script>

    <!-- [LAYER 3] UI & Gameplay Components -->
    <script src="src/components/TopBar.js"></script>
    <script src="src/components/Avatar.js"></script>
    <script src="src/components/WardrobeCatalog.js"></script>
    <script src="src/components/Decorations.js"></script>

    <!-- [LAYER 4] Scene & Engine Bootstrap -->
    <script src="src/scenes/BoutiqueScene.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
