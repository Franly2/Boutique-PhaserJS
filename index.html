<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Glow Up Boutique</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <script src="assets_data.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #23161c;
            font-family: 'Baloo Bhai 2', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #game-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <!-- Hidden DOM nodes to force early font rendering before canvas text is created -->
    <div style="font-family: 'Baloo Bhai 2'; font-weight: 700; position: absolute; left: -9999px; visibility: hidden;">preload</div>
    <div style="font-family: 'Baloo Bhai 2'; font-weight: 800; position: absolute; left: -9999px; visibility: hidden;">preload</div>

    <div id="game-container"></div>

    <script>
        /**
         * Main Interactive Dress-Up Scene
         * Handles asset loading, character customization, catalog interactions, and responsive scaling.
         */
        class BoutiqueScene extends Phaser.Scene {
            constructor() {
                super({ key: 'BoutiqueScene' });

                // Virtual reference resolution (16:9 widescreen layout)
                this.DESIGN_WIDTH = 3408;
                this.DESIGN_HEIGHT = 1572;

                // Active wardrobe equipment state
                this.currentEquipped = null;
                this.currentPants = null;
                this.currentGlasses = null;
                this.activeCategory = 'clothes';
            }

            // -------------------------------------------------------------
            // Scene Lifecycle: Asset Preload
            // -------------------------------------------------------------
            preload() {
                const hasBundle = typeof GAME_ASSETS !== 'undefined';
                const getAsset = (key, fallbackFile) => {
                    return hasBundle && GAME_ASSETS[key] ? GAME_ASSETS[key] : fallbackFile;
                };

                // Core environment and character assets
                this.load.image('bg', getAsset('bg', 'assets/UI/bg.png'));
                this.load.image('avatar_base', getAsset('avatar_base', 'assets/avatar/avatar-base.png'));
                this.load.image('char_base', getAsset('avatar_base', 'assets/avatar/avatar-base.png'));
                this.load.image('knowledge_charm', getAsset('knowledge_charm', 'assets/UI/HUD/knowledge-charm.png'));
                this.load.image('butterfly', getAsset('butterfly', 'assets/UI/butterfly.png'));
                this.load.image('finish_button', getAsset('finish_button', 'assets/UI/finish_button.png'));

                // HUD badges
                this.load.image('gloq_up', getAsset('gloq_up', 'assets/UI/HUD/gloq-up-boutique-bade.png'));
                this.load.image('coin_badge', getAsset('coin_badge', 'assets/UI/HUD/coin_badge.png'));
                this.load.image('style_badge', getAsset('style_badge', 'assets/UI/HUD/style-badge.png'));
                this.load.image('care_badge', getAsset('care_badge', 'assets/UI/HUD/care-badge.png'));
                this.load.image('title_badge', getAsset('title_badge', 'assets/UI/HUD/title-bade.png'));

                // Wardrobe category icons
                this.load.image('clothes_logo', getAsset('clothes_logo', 'assets/catalog-logo/clothes-logo.png'));
                this.load.image('pants_logo', getAsset('pants_logo', 'assets/catalog-logo/pants-logo.png'));
                this.load.image('dress_logo', getAsset('dress_logo', 'assets/catalog-logo/dress-logo.png'));
                this.load.image('shoes_logo', getAsset('shoes_logo', 'assets/catalog-logo/shoes-logo.png'));
                this.load.image('bag_logo', getAsset('bag_logo', 'assets/catalog-logo/bag-logo.png'));
                this.load.image('glasses_logo', getAsset('glasses_logo', 'assets/catalog-logo/glasses-logo.png'));

                // Tops & dresses catalog items
                for (let i = 1; i <= 9; i++) {
                    this.load.image('clothes_' + i, getAsset('clothes_' + i, 'assets/catalog-clothes/clothes-' + i + '.png'));
                    this.load.image('avatar_clothes_' + i, getAsset('avatar_clothes_' + i, 'assets/avatar-clothes/avatar-clothes-' + i + '.png'));
                }

                // Accessories & bottoms
                this.load.image('sun_glasses', getAsset('sun_glasses', 'assets/catalog-glasses/sun-glasses.png'));
                this.load.image('navy_skirt', getAsset('navy_skirt', 'assets/catalog-pants/navy-skirt.png'));
            }

            // -------------------------------------------------------------
            // Scene Lifecycle: Object Creation
            // -------------------------------------------------------------
            create() {
                // Fullscreen background layer
                this.createBackground();

                // Main gameplay container (holds all UI and character elements with uniform aspect ratio)
                this.mainContainer = this.add.container(0, 0).setDepth(1);

                // Build composite scene components
                this.createCarpet();
                this.createCharacter();
                this.createWardrobeCatalog();
                this.createDecorations();
                this.createTopBar();
                this.createSparkleTexture();

                // Initialize responsive layout calculations and window resize listeners
                this.setupResizeListeners();
            }

            // -------------------------------------------------------------
            // Component Builders
            // -------------------------------------------------------------
            createBackground() {
                // Background image is placed directly on the root scene to allow edge-to-edge cover
                this.bg = this.add.image(0, 0, 'bg').setOrigin(0.5, 0.5).setDepth(0);
            }

            createCarpet() {
                // Decorative layered oval rug beneath the avatar
                const carpet = this.add.graphics();
                carpet.fillStyle(0xd1869e, 0.35);
                carpet.fillEllipse(1704, 1324, 804, 156);
                carpet.fillStyle(0xffc4dc, 0.95);
                carpet.fillEllipse(1704, 1320, 794, 148);
                this.mainContainer.add(carpet);
            }

            createCharacter() {
                // Position avatar in the center of the viewport
                const charContainer = this.add.container(1704, 840);
                this.mainContainer.add(charContainer);

                // Wrapper container allows base body and equipped garments to animate in unison
                this.avatarWrapper = this.add.container(0, 0).setScale(1.235);
                charContainer.add(this.avatarWrapper);

                // Mannequin base sprite
                this.avatar = this.add.image(0, 0, 'avatar_base').setOrigin(0.5, 0.5);
                this.avatarWrapper.add(this.avatar);

                // Outfit calibration tables (scale and vertical offset for precise alignment)
                this.clothesConfig = {
                    1: { scale: 2.15, y: -287 },
                    2: { scale: 2.10, y: -287 },
                    3: { scale: 2.15, y: -284 },
                    4: { scale: 2.25, y: -282 },
                    5: { scale: 2.25, y: -274 },
                    6: { scale: 2.20, y: -267 },
                    7: { scale: 2.15, y: -284 },
                    8: { scale: 2.15, y: -287 },
                    9: { scale: 2.20, y: -277 }
                };

                this.pantsConfig = {
                    'navy_skirt': { scale: 1.12, x: -5, y: -15 }
                };

                this.glassesConfig = {
                    'sun_glasses': { scale: 0.9, x: -5, y: -368 }
                };

                // Garment layers: Bottoms
                const initPants = this.pantsConfig['navy_skirt'];
                this.equippedPants = this.add.image(initPants.x, initPants.y, 'navy_skirt')
                    .setOrigin(0.5, 0)
                    .setScale(initPants.scale)
                    .setVisible(false);
                this.avatarWrapper.add(this.equippedPants);

                // Garment layers: Tops
                this.equippedTop = this.add.image(0, 0, 'clothes_1')
                    .setOrigin(0.5, 0)
                    .setVisible(false);
                this.avatarWrapper.add(this.equippedTop);

                // Garment layers: Accessories
                const initGlasses = this.glassesConfig['sun_glasses'];
                this.equippedGlasses = this.add.image(initGlasses.x, initGlasses.y, 'sun_glasses')
                    .setOrigin(0.5, 0.5)
                    .setScale(initGlasses.scale)
                    .setVisible(false);
                this.avatarWrapper.add(this.equippedGlasses);

                // Gentle breathing animation
                this.tweens.add({
                    targets: this.avatarWrapper,
                    scaleY: 1.242,
                    duration: 2200,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                // Tap avatar for sparkling burst effect
                this.avatar.setInteractive({ useHandCursor: true });
                this.avatar.on('pointerdown', () => {
                    this.spawnSparkles(1704, 600, 0xff9ec7);
                });
            }

            createDecorations() {
                // Bottom-left knowledge charm panel
                this.knowledgeCharm = this.add.image(155, 1290, 'knowledge_charm').setOrigin(0, 0);
                this.mainContainer.add(this.knowledgeCharm);

                // Animated mascot butterfly
                this.butterfly = this.add.image(2302, 1068, 'butterfly')
                    .setOrigin(0.5, 0.5)
                    .setInteractive({ useHandCursor: true });
                this.mainContainer.add(this.butterfly);

                // Bottom-center finish action button
                const btnX = 1704;
                const btnY = 1440;
                this.finishBtn = this.add.image(btnX, btnY, 'finish_button')
                    .setOrigin(0.5, 0.5)
                    .setInteractive({ useHandCursor: true });
                this.mainContainer.add(this.finishBtn);

                this.finishBtn.on('pointerover', () => {
                    this.tweens.add({
                        targets: this.finishBtn,
                        scale: 1.05,
                        duration: 160,
                        ease: 'Sine.easeOut'
                    });
                });

                this.finishBtn.on('pointerout', () => {
                    this.tweens.add({
                        targets: this.finishBtn,
                        scale: 1.0,
                        duration: 160,
                        ease: 'Sine.easeOut'
                    });
                });

                this.finishBtn.on('pointerdown', () => {
                    this.tweens.add({
                        targets: this.finishBtn,
                        scale: 0.94,
                        duration: 90,
                        yoyo: true,
                        ease: 'Quad.easeInOut',
                        onComplete: () => {
                            this.spawnCelebration(btnX, btnY);
                        }
                    });
                });
            }

            createTopBar() {
                // Top status and currency badges
                const badgeGlowUp = this.add.image(160, 68, 'gloq_up').setOrigin(0, 0).setScale(1.15);
                const badgeCoin = this.add.image(935, 66, 'coin_badge').setOrigin(0, 0).setScale(1.6);
                const badgeStyle = this.add.image(1325, 66, 'style_badge').setOrigin(0, 0).setScale(1.6);
                const badgeCare = this.add.image(1820, 66, 'care_badge').setOrigin(0, 0).setScale(1.6);

                // Occasion header card
                const pillGfx = this.add.graphics();
                pillGfx.fillStyle(0x000000, 0.05);
                pillGfx.fillRoundedRect(2321, 68, 930, 127, 60);
                pillGfx.fillStyle(0xffffff, 1.0);
                pillGfx.fillRoundedRect(2321, 64, 930, 127, 60);

                const badgeTitle = this.add.image(2375, 64 + (127 - 64 * 1.45) / 2, 'title_badge')
                    .setOrigin(0, 0)
                    .setScale(1.45);

                this.mainContainer.add([pillGfx, badgeGlowUp, badgeCoin, badgeStyle, badgeCare, badgeTitle]);
            }

            createWardrobeCatalog() {
                const cardWidth = 742;
                const catalogX = 155;
                const catalogY = 256;

                this.catalogContainer = this.add.container(catalogX, catalogY);
                this.mainContainer.add(this.catalogContainer);

                // Card background graphics with dual drop-shadow
                const cardGfx = this.add.graphics();
                cardGfx.fillStyle(0x000000, 0.08);
                cardGfx.fillRoundedRect(0, 10, cardWidth, 976, 48);
                cardGfx.fillStyle(0x000000, 0.04);
                cardGfx.fillRoundedRect(0, 18, cardWidth, 968, 48);
                cardGfx.fillStyle(0xffffff, 1.0);
                cardGfx.fillRoundedRect(0, 0, cardWidth, 976, 48);
                this.catalogContainer.add(cardGfx);

                // Category tab buttons
                const categories = [
                    { id: 'clothes', logo: 'clothes_logo', x: 92 },
                    { id: 'pants', logo: 'pants_logo', x: 203 },
                    { id: 'dress', logo: 'dress_logo', x: 314 },
                    { id: 'shoes', logo: 'shoes_logo', x: 426 },
                    { id: 'bag', logo: 'bag_logo', x: 537 },
                    { id: 'glasses', logo: 'glasses_logo', x: 648 }
                ];

                this.categoryTabs = {};
                this.activeCategory = 'clothes';

                categories.forEach((cat) => {
                    const tabContainer = this.add.container(cat.x, 80);
                    const circleGfx = this.add.graphics();
                    const icon = this.add.image(0, 0, cat.logo).setOrigin(0.5, 0.5);

                    tabContainer.add([circleGfx, icon]);
                    tabContainer.setSize(80, 80);
                    tabContainer.setInteractive({ useHandCursor: true });

                    tabContainer.on('pointerover', () => {
                        this.tweens.add({
                            targets: tabContainer,
                            scale: 1.08,
                            duration: 130,
                            ease: 'Sine.easeOut'
                        });
                    });

                    tabContainer.on('pointerout', () => {
                        this.tweens.add({
                            targets: tabContainer,
                            scale: 1.0,
                            duration: 130,
                            ease: 'Sine.easeOut'
                        });
                    });

                    tabContainer.on('pointerdown', () => {
                        this.switchCategory(cat.id);
                        this.tweens.add({
                            targets: tabContainer,
                            scale: 0.93,
                            duration: 80,
                            yoyo: true,
                            ease: 'Quad.easeInOut'
                        });
                    });

                    this.categoryTabs[cat.id] = { container: tabContainer, gfx: circleGfx, icon: icon };
                    this.catalogContainer.add(tabContainer);
                });

                // User prompt text
                this.hintText = this.add.text(371, 198, 'Drag an item to the client!', {
                    fontFamily: '"Baloo Bhai 2", cursive, sans-serif',
                    fontSize: '34px',
                    fontWeight: '800',
                    color: '#ec84ae'
                }).setOrigin(0.5, 0.5);
                this.catalogContainer.add(this.hintText);

                // Empty state message
                this.emptyStateText = this.add.text(371, 560, 'No items in this category', {
                    fontFamily: '"Baloo Bhai 2", cursive, sans-serif',
                    fontSize: '32px',
                    fontWeight: '700',
                    color: '#a0a0b0'
                }).setOrigin(0.5, 0.5).setVisible(false);
                this.catalogContainer.add(this.emptyStateText);

                // Ensure web fonts apply reliably once loaded by browser
                if (document.fonts) {
                    document.fonts.ready.then(() => {
                        if (this.hintText && this.hintText.active) {
                            this.hintText.setFontFamily('"Baloo Bhai 2", cursive, sans-serif');
                        }
                        if (this.emptyStateText && this.emptyStateText.active) {
                            this.emptyStateText.setFontFamily('"Baloo Bhai 2", cursive, sans-serif');
                        }
                    });
                }

                // 3x3 Grid of item cards
                this.gridContainer = this.add.container(0, 0);
                this.catalogContainer.add(this.gridContainer);

                // Inventory catalog dataset
                this.catalogData = {
                    clothes: [
                        { id: 1, key: 'clothes_1', type: 'clothes', scale: 1.0 },
                        { id: 2, key: 'clothes_2', type: 'clothes', scale: 1.0 },
                        { id: 3, key: 'clothes_3', type: 'clothes', scale: 1.0 },
                        { id: 4, key: 'clothes_4', type: 'clothes', scale: 1.0 },
                        { id: 5, key: 'clothes_5', type: 'clothes', scale: 1.0 },
                        { id: 6, key: 'clothes_6', type: 'clothes', scale: 1.0 },
                        { id: 7, key: 'clothes_7', type: 'clothes', scale: 1.0 },
                        { id: 8, key: 'clothes_8', type: 'clothes', scale: 1.0 },
                        { id: 9, key: 'clothes_9', type: 'clothes', scale: 1.0 }
                    ],
                    pants: [
                        { id: 'navy_skirt', key: 'navy_skirt', type: 'pants', scale: 0.65 }
                    ],
                    glasses: [
                        { id: 'sun_glasses', key: 'sun_glasses', type: 'glasses', scale: 0.82 }
                    ],
                    dress: [],
                    shoes: [],
                    bag: []
                };

                const colX = [151, 371, 591];
                const rowY = [379, 599, 819];
                const cardColors = [
                    0xd8efe9, 0xfde6f0, 0xe2efff,
                    0xfef7da, 0xd8efe9, 0xf2eaff,
                    0xffeee3, 0xfde6f0, 0xd8efe9
                ];

                this.gridSlots = [];

                for (let i = 0; i < 9; i++) {
                    const row = Math.floor(i / 3);
                    const col = i % 3;
                    const cx = colX[col];
                    const cy = rowY[row];

                    const itemCard = this.add.container(cx, cy);

                    const bgGfx = this.add.graphics();
                    bgGfx.fillStyle(cardColors[i], 1.0);
                    bgGfx.fillRoundedRect(-100, -100.5, 200, 201, 24);
                    itemCard.add(bgGfx);

                    const borderGfx = this.add.graphics();
                    borderGfx.lineStyle(6, 0xffd023, 1.0);
                    borderGfx.strokeRoundedRect(-100, -100.5, 200, 201, 24);
                    borderGfx.setVisible(false);
                    itemCard.add(borderGfx);

                    const itemSprite = this.add.image(0, 0, 'clothes_1').setOrigin(0.5, 0.5);
                    itemCard.add(itemSprite);

                    itemCard.setSize(200, 201);
                    itemCard.setInteractive({ useHandCursor: true, draggable: true });

                    const slotObj = {
                        container: itemCard,
                        border: borderGfx,
                        sprite: itemSprite,
                        itemData: null
                    };

                    itemCard.on('pointerover', () => {
                        this.tweens.add({
                            targets: itemCard,
                            scale: 1.04,
                            duration: 130,
                            ease: 'Sine.easeOut'
                        });
                    });

                    itemCard.on('pointerout', () => {
                        this.tweens.add({
                            targets: itemCard,
                            scale: 1.0,
                            duration: 130,
                            ease: 'Sine.easeOut'
                        });
                    });

                    let startPointerX = 0;
                    let startPointerY = 0;
                    let dragGhost = null;

                    itemCard.on('pointerdown', (pointer) => {
                        startPointerX = pointer.x;
                        startPointerY = pointer.y;
                    });

                    // Drag-and-drop mechanics
                    itemCard.on('dragstart', (pointer) => {
                        if (!slotObj.itemData) return;

                        let ghostScale = 2.0;
                        if (slotObj.itemData.type === 'glasses') {
                            ghostScale = (this.glassesConfig[slotObj.itemData.id] ? this.glassesConfig[slotObj.itemData.id].scale : 0.7);
                        } else if (slotObj.itemData.type === 'pants') {
                            ghostScale = (this.pantsConfig[slotObj.itemData.id] ? this.pantsConfig[slotObj.itemData.id].scale : 1.12);
                        }

                        const localPt = this.getLocalPoint(pointer);
                        dragGhost = this.add.image(localPt.x, localPt.y, slotObj.itemData.key)
                            .setScale(ghostScale)
                            .setAlpha(0.85);
                        this.mainContainer.add(dragGhost);
                    });

                    itemCard.on('drag', (pointer) => {
                        if (dragGhost) {
                            const localPt = this.getLocalPoint(pointer);
                            dragGhost.x = localPt.x;
                            dragGhost.y = localPt.y;
                        }
                    });

                    itemCard.on('dragend', (pointer) => {
                        if (dragGhost) {
                            const localPt = this.getLocalPoint(pointer);
                            const distToAvatar = Phaser.Math.Distance.Between(localPt.x, localPt.y, 1704, 840);

                            // Equip item if dropped over or near the avatar
                            if (distToAvatar < 650 || localPt.x > 1150) {
                                this.equipItem(slotObj.itemData);
                            }

                            dragGhost.destroy();
                            dragGhost = null;
                        }

                        this.tweens.add({
                            targets: itemCard,
                            scale: 1.0,
                            duration: 120,
                            ease: 'Sine.easeOut'
                        });
                    });

                    // Quick-tap to equip
                    itemCard.on('pointerup', (pointer) => {
                        const movedDist = Phaser.Math.Distance.Between(startPointerX, startPointerY, pointer.x, pointer.y);
                        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                        const tapTolerance = 30 * dpr;

                        if (movedDist < tapTolerance && slotObj.itemData) {
                            this.tweens.add({
                                targets: itemCard,
                                scale: 0.94,
                                duration: 80,
                                yoyo: true,
                                ease: 'Quad.easeInOut',
                                onComplete: () => {
                                    this.equipItem(slotObj.itemData);
                                }
                            });
                        }
                    });

                    this.gridSlots.push(slotObj);
                    this.gridContainer.add(itemCard);
                }

                this.updateTabStyles();
                this.renderCatalog('clothes');
            }

            // -------------------------------------------------------------
            // Wardrobe & Equipment Logic
            // -------------------------------------------------------------
            equipItem(item) {
                if (!item) return;

                if (item.type === 'clothes') {
                    this.equipClothes(item.id);
                } else if (item.type === 'pants') {
                    this.equipPants(item.id);
                } else if (item.type === 'glasses') {
                    this.equipGlasses(item.id);
                }
            }

            equipClothes(id) {
                if (this.currentEquipped === id) {
                    this.currentEquipped = null;
                    this.equippedTop.setVisible(false);
                } else {
                    this.currentEquipped = id;
                    const cfg = this.clothesConfig[id] || { scale: 2.15, y: -282 };
                    this.equippedTop.setTexture('clothes_' + id);
                    this.equippedTop.setScale(cfg.scale);
                    this.equippedTop.y = cfg.y;
                    this.equippedTop.setVisible(true);
                    this.spawnFloatingScore(1704, 620, '+Style');
                }
                this.updateGridBorders();
            }

            equipPants(id) {
                if (this.currentPants === id) {
                    this.currentPants = null;
                    this.equippedPants.setVisible(false);
                } else {
                    this.currentPants = id;
                    const cfg = this.pantsConfig[id] || { scale: 1.12, x: 0, y: -80 };
                    this.equippedPants.setTexture(id);
                    this.equippedPants.setScale(cfg.scale);
                    this.equippedPants.x = cfg.x || 0;
                    this.equippedPants.y = cfg.y;
                    this.equippedPants.setVisible(true);
                    this.spawnFloatingScore(1704, 760, '+Style');
                }
                this.updateGridBorders();
            }

            equipGlasses(id) {
                if (this.currentGlasses === id) {
                    this.currentGlasses = null;
                    this.equippedGlasses.setVisible(false);
                } else {
                    this.currentGlasses = id;
                    const cfg = this.glassesConfig[id] || { scale: 0.9, x: -5, y: -368 };
                    this.equippedGlasses.setTexture(id);
                    this.equippedGlasses.setScale(cfg.scale);
                    this.equippedGlasses.x = cfg.x;
                    this.equippedGlasses.y = cfg.y;
                    this.equippedGlasses.setVisible(true);
                    this.spawnFloatingScore(1704, 480, '+Style');
                }
                this.updateGridBorders();
            }

            switchCategory(catId) {
                if (this.activeCategory === catId) return;
                this.activeCategory = catId;
                this.updateTabStyles();
                this.renderCatalog(catId);
            }

            updateTabStyles() {
                Object.keys(this.categoryTabs).forEach((catId) => {
                    const tab = this.categoryTabs[catId];
                    const isActive = (catId === this.activeCategory);

                    tab.gfx.clear();
                    if (isActive) {
                        tab.gfx.fillStyle(0xfd5da3, 1.0);
                        tab.gfx.fillCircle(0, 0, 40);
                        tab.icon.setTint(0xffffff);
                    } else {
                        tab.gfx.fillStyle(0xfbe3f1, 1.0);
                        tab.gfx.fillCircle(0, 0, 40);
                        tab.icon.clearTint();
                    }
                });
            }

            renderCatalog(catId) {
                const items = this.catalogData[catId] || [];
                const hasItems = items.length > 0;

                this.hintText.setVisible(hasItems);
                this.gridContainer.setVisible(hasItems);
                this.emptyStateText.setVisible(!hasItems);

                if (hasItems) {
                    for (let i = 0; i < 9; i++) {
                        const slot = this.gridSlots[i];
                        const item = items[i];

                        if (item) {
                            slot.container.setVisible(true);
                            slot.itemData = item;
                            slot.sprite.setTexture(item.key);
                            slot.sprite.setScale(item.scale || 1.0);
                        } else {
                            slot.container.setVisible(false);
                            slot.itemData = null;
                        }
                    }

                    this.updateGridBorders();

                    // Smooth fade transition
                    this.gridContainer.setAlpha(0);
                    this.tweens.add({
                        targets: this.gridContainer,
                        alpha: 1,
                        duration: 180,
                        ease: 'Cubic.easeOut'
                    });
                }
            }

            updateGridBorders() {
                for (let i = 0; i < 9; i++) {
                    const slot = this.gridSlots[i];
                    if (slot && slot.container.visible && slot.itemData) {
                        const item = slot.itemData;
                        let isSelected = false;

                        if (item.type === 'clothes') {
                            isSelected = (this.currentEquipped === item.id);
                        } else if (item.type === 'pants') {
                            isSelected = (this.currentPants === item.id);
                        } else if (item.type === 'glasses') {
                            isSelected = (this.currentGlasses === item.id);
                        }

                        slot.border.setVisible(isSelected);
                    }
                }
            }

            bounceAvatar() {
                this.tweens.add({
                    targets: this.avatarWrapper,
                    scaleX: 1.28,
                    scaleY: 1.18,
                    duration: 120,
                    yoyo: true,
                    ease: 'Back.easeOut'
                });
            }

            // -------------------------------------------------------------
            // Visual Effects & Feedback
            // -------------------------------------------------------------
            spawnFloatingScore(x, y, text) {
                const scoreText = this.add.text(x, y, text, {
                    fontFamily: '"Baloo Bhai 2", cursive, sans-serif',
                    fontSize: '44px',
                    fontWeight: '800',
                    fill: '#ff007f',
                    stroke: '#ffffff',
                    strokeThickness: 8
                }).setOrigin(0.5, 0.5);

                this.mainContainer.add(scoreText);

                this.tweens.add({
                    targets: scoreText,
                    y: y - 110,
                    alpha: 0,
                    scale: 1.25,
                    duration: 900,
                    ease: 'Cubic.easeOut',
                    onComplete: () => scoreText.destroy()
                });
            }

            createSparkleTexture() {
                // Procedural 4-point diamond star texture
                const gfx = this.make.graphics({ x: 0, y: 0, add: false });
                gfx.fillStyle(0xffffff, 1);
                gfx.beginPath();
                gfx.moveTo(16, 0);
                gfx.lineTo(20, 12);
                gfx.lineTo(32, 16);
                gfx.lineTo(20, 20);
                gfx.lineTo(16, 32);
                gfx.lineTo(12, 20);
                gfx.lineTo(0, 16);
                gfx.lineTo(12, 12);
                gfx.closePath();
                gfx.fillPath();
                gfx.generateTexture('star_sparkle', 32, 32);
            }

            spawnSparkles(x, y, tint = 0xffffff) {
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Phaser.Math.Between(60, 240);
                    const star = this.add.image(x, y, 'star_sparkle')
                        .setTint(tint)
                        .setScale(Phaser.Math.FloatBetween(0.8, 1.8))
                        .setAlpha(1);

                    this.mainContainer.add(star);

                    this.tweens.add({
                        targets: star,
                        x: x + Math.cos(angle) * speed,
                        y: y + Math.sin(angle) * speed,
                        alpha: 0,
                        scale: 0.2,
                        angle: Phaser.Math.Between(-180, 180),
                        duration: Phaser.Math.Between(600, 950),
                        ease: 'Cubic.easeOut',
                        onComplete: () => star.destroy()
                    });
                }
            }

            spawnCelebration(x, y) {
                const colors = [0xff007f, 0xffd700, 0xffffff, 0xb388ff, 0x00e5ff];

                for (let i = 0; i < 35; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Phaser.Math.Between(100, 480);
                    const color = colors[i % colors.length];

                    const star = this.add.image(x, y, 'star_sparkle')
                        .setTint(color)
                        .setScale(Phaser.Math.FloatBetween(1.0, 2.4))
                        .setAlpha(1);

                    this.mainContainer.add(star);

                    this.tweens.add({
                        targets: star,
                        x: x + Math.cos(angle) * dist,
                        y: y + Math.sin(angle) * dist - 80,
                        alpha: 0,
                        scale: 0.1,
                        angle: Phaser.Math.Between(-360, 360),
                        duration: Phaser.Math.Between(800, 1400),
                        ease: 'Quad.easeOut',
                        onComplete: () => star.destroy()
                    });
                }
            }

            // -------------------------------------------------------------
            // Coordinate System Translation
            // -------------------------------------------------------------
            getLocalPoint(pointer) {
                // Converts screen / pointer coordinates into internal mainContainer coordinate space
                const scale = (this.mainContainer && this.mainContainer.scaleX) ? this.mainContainer.scaleX : 1;
                const containerX = this.mainContainer ? this.mainContainer.x : 0;
                const containerY = this.mainContainer ? this.mainContainer.y : 0;

                return {
                    x: (pointer.x - containerX) / scale,
                    y: (pointer.y - containerY) / scale
                };
            }

            // -------------------------------------------------------------
            // Responsive Layout & High-DPI Scaling
            // -------------------------------------------------------------
            setupResizeListeners() {
                this.handleResize();

                this.onResizeHandler = () => this.handleResize();
                window.addEventListener('resize', this.onResizeHandler);
                window.addEventListener('orientationchange', () => {
                    setTimeout(this.onResizeHandler, 150);
                });

                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', this.onResizeHandler);
                }
            }

            handleResize() {
                // Determine device pixel ratio (capped at 2.5x for performance and battery efficiency)
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

                // Use visualViewport if available to account for mobile browser UI (address bar/gesture bar)
                const cssWidth = (window.visualViewport ? window.visualViewport.width : window.innerWidth) || window.innerWidth;
                const cssHeight = (window.visualViewport ? window.visualViewport.height : window.innerHeight) || window.innerHeight;

                const physicalWidth = Math.round(cssWidth * dpr);
                const physicalHeight = Math.round(cssHeight * dpr);

                // Keep scale zoom inverted to maintain crisp native resolution on high-DPI displays
                if (Math.abs(this.scale.zoom - (1 / dpr)) > 0.001) {
                    this.scale.setZoom(1 / dpr);
                }

                if (this.scale.width !== physicalWidth || this.scale.height !== physicalHeight) {
                    this.scale.resize(physicalWidth, physicalHeight);
                }

                // 1. Cover background (edge-to-edge full bleed without aspect distortion)
                if (this.bg) {
                    this.bg.setPosition(physicalWidth / 2, physicalHeight / 2);
                    const bgScale = Math.max(physicalWidth / this.bg.width, physicalHeight / this.bg.height);
                    this.bg.setScale(bgScale);
                }

                // 2. Uniform scaling for main gameplay container (centers gameplay cleanly)
                if (this.mainContainer) {
                    // Mobile edge padding
                    const paddingX = cssWidth < 1200 ? 24 * dpr : 0;
                    const paddingY = cssHeight < 600 ? 20 * dpr : 0;

                    const availableW = Math.max(100, physicalWidth - paddingX * 2);
                    const availableH = Math.max(100, physicalHeight - paddingY * 2);

                    const scaleX = availableW / this.DESIGN_WIDTH;
                    const scaleY = availableH / this.DESIGN_HEIGHT;
                    const uiScale = Math.min(scaleX, scaleY);

                    this.mainContainer.setScale(uiScale);
                    this.mainContainer.setPosition(
                        (physicalWidth - this.DESIGN_WIDTH * uiScale) / 2,
                        (physicalHeight - this.DESIGN_HEIGHT * uiScale) / 2
                    );
                }
            }
        }

        // -------------------------------------------------------------
        // Game Engine Configuration
        // -------------------------------------------------------------
        const initialDPR = Math.min(window.devicePixelRatio || 1, 2.5);

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: Math.round(window.innerWidth * initialDPR),
            height: Math.round(window.innerHeight * initialDPR),
            scale: {
                mode: Phaser.Scale.NONE,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                zoom: 1 / initialDPR
            },
            render: {
                pixelArt: false,
                antialias: true,
                antialiasGL: true,
                roundPixels: false
            },
            scene: BoutiqueScene
        };

        const game = new Phaser.Game(config);
        window.game = game;
    </script>
